# backend.conf — where secrets-exec fetches values from. Install to ~/.config/secrets-exec/backend.conf
# (mode 0600, directory 0700). Same trust as consumers.conf: whoever can write this file decides
# where values come from.
#
#   host  ssh destination, ideally an ~/.ssh/config alias for a separate key host; must not start with '-'
#   get   remote command that prints ONE value on stdout; {bundle} then {key} are inserted single-quoted
#   list  remote command that prints a bundle's key NAMES, one per line (only used for '*' key patterns)
#
# Templates are plain words: letters, digits, _ . / ~ - space and the two placeholders. No quotes or
# shell metacharacters. The remote side should run with a restricted key (e.g. an authorized_keys
# forced command) so this account cannot do anything else on the key host.
host=keyhost.example
get=kv-get {bundle} {key}
list=kv-list {bundle}
