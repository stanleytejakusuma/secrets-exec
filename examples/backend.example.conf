# backend.conf: where secrets-exec fetches values from. Install as
# ~/.config/secrets-exec/backend.conf (mode 0600, directory 0700). Same trust as consumers.conf:
# whoever can write this file decides where values come from.
#
#   host  "local" to run a helper on this machine, or an ssh destination (an ~/.ssh/config
#         alias, host or user@host; must not start with '-')
#   get   command that prints ONE value on stdout; {bundle} then {key} are filled in
#   list  command that prints a bundle's key NAMES, one per line (only for '*' key patterns)
#
# Templates are plain words: letters, digits, _ . / ~ , - and spaces. {bundle} and {key} must
# be whole words. No quotes or shell metacharacters. With host=local the words are run
# directly as a command (no shell); over ssh, the names are inserted single-quoted.
#
# Nothing below is active. Pick ONE option, uncomment its three lines and adjust them.
# The reference key host (examples/keyhost/) works with both options; see its README.

# Option A: same machine, separate OS user. The store belongs to a dedicated account the
# agent's user cannot read; a sudoers rule lets your user run only the key host as it.
#host=local
#get=/usr/bin/sudo -n -u secrets-store /usr/local/bin/secrets-exec-keyhost --store /var/lib/secrets-store/store --allow example-code get {bundle} {key}
#list=/usr/bin/sudo -n -u secrets-store /usr/local/bin/secrets-exec-keyhost --store /var/lib/secrets-store/store --allow example-code list {bundle}

# Option B: separate machine over SSH, with a restricted forced-command key.
#host=keyhost
#get=get {bundle} {key}
#list=list {bundle}
