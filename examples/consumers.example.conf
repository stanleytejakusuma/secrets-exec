# consumers.conf: consumer|bundle|key(s)|environment-name(s)|absolute-command|optional-guards
# These are fictional names, not credentials. Replace /home/you with the installation home.
# No shell expansion, quoting, whitespace trimming or tilde expansion is performed here.
# The registry owner must review the actual program, not just its filename.
# Never register a shell, interpreter, environment dumper or generic HTTP client directly.
# Guards are secondary: comma-separated phrases, or forbidden flag prefixes.
# Multi-key columns must have equal-length '+' lists of exact UPPER_SNAKE names.
github-read|example-code|GITHUB_TOKEN|GITHUB_PAT|/home/you/.config/secrets-exec/consumers.d/github-read|
bitget-read|example-bitget|API_KEY+API_SECRET+API_PASSPHRASE|BITGET_API_KEY+BITGET_API_SECRET+BITGET_PASSPHRASE|/home/you/.config/secrets-exec/consumers.d/bitget-read|
mexc-read|example-mexc|API_KEY+API_SECRET|MEXC_API_KEY+MEXC_API_SECRET|/home/you/.config/secrets-exec/consumers.d/mexc-read|
# The demo deliberately does nothing with its injected value.
demo|example-demo|DEMO_TOKEN|DEMO_TOKEN|/usr/bin/true|
