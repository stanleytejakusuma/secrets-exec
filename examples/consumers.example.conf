# consumers.conf: consumer|bundle|key(s)|environment-name(s)|absolute-command|optional-guards
#
# Every row below is COMMENTED OUT. A row is an authorization: uncomment only the ones you
# have reviewed, and replace /home/you with your absolute home path. Bundle and key names
# are examples; use the names in your own key store. No values ever go in this file.
#
# Rules: no shell expansion, quoting, whitespace trimming or ~ expansion. Never register a
# shell, interpreter, environment dumper or general CLI/HTTP client. Review the program,
# not its filename. Guards are secondary mistake prevention: comma-separated phrases or
# forbidden flag prefixes. Multi-key rows use equal-length '+' lists of UPPER_SNAKE names.

# GitHub, read-only: GET requests to an allowlisted set of API paths (see http-consumers/).
#github-read|example-code|GITHUB_TOKEN|GITHUB_PAT|/home/you/.config/secrets-exec/consumers.d/github-read|

# Advanced: read-only crypto-exchange readers (HMAC-signed, multi-key). Not installed by
# default; copy them from examples/advanced/consumers.d/ into consumers.d/ after review.
#bitget-read|example-bitget|API_KEY+API_SECRET+API_PASSPHRASE|BITGET_API_KEY+BITGET_API_SECRET+BITGET_PASSPHRASE|/home/you/.config/secrets-exec/consumers.d/bitget-read|
#mexc-read|example-mexc|API_KEY+API_SECRET|MEXC_API_KEY+MEXC_API_SECRET|/home/you/.config/secrets-exec/consumers.d/mexc-read|
